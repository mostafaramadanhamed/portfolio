name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A <username>.github.io repo is served from the root; any other repo
      # is served from /<repo-name>/.
      - name: Build web
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${{ github.repository_owner }}.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPO/"
          fi
          flutter build web --release --base-href "$BASE_HREF"
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
