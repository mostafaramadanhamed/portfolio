  <style>
    html, body { margin: 0; background: #0A0E14; }

    /* Shown while Flutter downloads and starts; removed on the first frame. */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: #0A0E14;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      transition: opacity 400ms ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .logo { font-size: 26px; font-weight: 700; color: #E6EDF3; letter-spacing: -0.5px; }
    #loader .logo span { color: #54C5F8; font-weight: 400; }
    #loader .track { width: 160px; height: 3px; border-radius: 3px; background: #1F2A3A; overflow: hidden; }
    #loader .bar {
      width: 40%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #54C5F8, #8A7CFF);
      animation: slide 1.1s ease-in-out infinite;
    }
    #loader .hint { font-size: 13px; color: #5C6B7F; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loader .bar { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="logo"><span>&lt;</span>Mostafa<span> /&gt;</span></div>
    <div class="track"><div class="bar"></div></div>
    <div class="hint">loading portfolio…</div>
  </div>

  <noscript>
    <main style="font-family:system-ui,sans-serif;color:#E6EDF3;max-width:640px;margin:80px auto;padding:0 20px">

        or on <a style="color:#54C5F8" href="https://github.com/mostafaramadanhamed">GitHub</a>.</p>
    </main>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      if (!loader) return;
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
